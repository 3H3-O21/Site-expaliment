<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi des heures</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="outils.css">
</head>
<body>
  <main>

    <!-- ========== 1. ACCUEIL ========== -->
    <section class="view view--beige active" id="accueil">
      <div class="deco deco--accueil" aria-hidden="true"></div>
      <div class="accueil-contenu">
        <button type="button" class="btn btn--taupe btn--grand" data-goto="connexion">Connection</button>
        <button type="button" class="lien" data-goto="inscription">Inscription</button>
      </div>
    </section>

    <!-- ========== 2. CONNEXION ========== -->
    <section class="view view--olive" id="connexion">
      <div class="deco deco--coin" aria-hidden="true"></div>
      <form class="formulaire" id="form-connexion">
        <h1>Connection</h1>

        <label for="connexion-courriel">Courriel</label>
        <input type="email" id="connexion-courriel" autocomplete="email" required>

        <label for="connexion-mdp">mot de passe</label>
        <input type="password" id="connexion-mdp" autocomplete="current-password" required>

        <button type="button" class="lien col-2" data-goto="oubli">mot de passe oublié</button>

        <button type="submit" class="btn btn--contour col-2">Connection</button>

        <p class="message tout" role="status" aria-live="polite"></p>
        <button type="button" class="lien tout" data-goto="accueil">← Retour</button>
      </form>
    </section>

    <!-- ========== 3. INSCRIPTION ========== -->
    <section class="view view--olive" id="inscription">
      <div class="deco deco--coin" aria-hidden="true"></div>
      <form class="formulaire" id="form-inscription">
        <h1>Inscription</h1>

        <label for="inscription-courriel">Courriel</label>
        <input type="email" id="inscription-courriel" autocomplete="email" required>

        <label for="inscription-mdp">mot de passe</label>
        <input type="password" id="inscription-mdp" autocomplete="new-password" minlength="8" required>

        <button type="submit" class="btn btn--contour col-2">S'inscrire</button>

        <p class="message tout" role="status" aria-live="polite"></p>
        <button type="button" class="lien tout" data-goto="accueil">← Retour</button>
      </form>
    </section>

    <!-- ========== 4. MOT DE PASSE OUBLIÉ ==========
         Firebase envoie un courriel avec un lien sécurisé : c'est sur
         la page ouverte par ce lien que la personne choisit son nouveau mot de passe. -->
    <section class="view view--beige" id="oubli">
      <form class="formulaire" id="form-oubli">
        <h1>Mot de passe oublié</h1>

        <label for="oubli-courriel">Courriel</label>
        <input type="email" id="oubli-courriel" autocomplete="email" required>

        <button type="submit" class="btn btn--olive col-2">Envoyer le lien</button>

        <p class="message tout" role="status" aria-live="polite"></p>
        <button type="button" class="lien tout" data-goto="connexion">← Retour à la connexion</button>
      </form>
    </section>

    <!-- ========== 5. SUIVI DES HEURES (après la connexion) ========== -->
    <section class="view view--app" id="app">

      <header class="app-entete">
        <button type="button" class="btn-reglages" id="btn-reglages" title="Réglages des couleurs" aria-label="Réglages des couleurs" aria-expanded="false" aria-controls="panneau-reglages">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="btn btn--contour-clair btn-outils" id="btn-outils" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-outils">Outils <span class="chevron" aria-hidden="true">▾</span></button>
        <span class="statut" id="statut-enregistrement" aria-live="polite"></span>
        <span class="pastille" id="app-courriel" role="img"></span>
        <button type="button" class="btn btn--contour-clair" id="btn-deconnexion">Déconnexion</button>
      </header>

      <!-- Avis (vérification du courriel, erreurs) : invisible quand il est vide -->
      <div class="app-avis">
        <p class="message message--info" id="app-verif" data-verif role="status"></p>
        <button type="button" class="lien" id="btn-renvoyer-verif" hidden>Renvoyer le courriel de vérification</button>
        <p class="message" role="status" aria-live="polite"></p>
      </div>

      <div id="zone-feuille" hidden>
        <div class="feuille-defile">
          <div class="feuille">
            <!-- « Ajouter une ligne » est centré au-dessus d'« Objet » (même grille que les lignes) -->
            <div class="feuille-outils">
              <button type="button" class="btn btn--bordure btn--ajouter" id="btn-ajouter-ligne">Ajouter une ligne</button>
              <button type="button" class="btn btn--bordure btn--effacer" id="btn-tout-effacer">Tout effacer</button>
            </div>

            <div class="feuille-entete" aria-hidden="true">
              <span></span>
              <span class="entete-grand">Objet</span>
              <span class="entete-grand">Tâche</span>
              <span>Dim</span>
              <span>Lun</span>
              <span>Mar</span>
              <span>Mer</span>
              <span>Jeu</span>
              <span>Ven</span>
              <span>Sam</span>
            </div>

            <!-- Totaux d'heures par jour, entre les jours de la semaine et les cases -->
            <div class="feuille-totaux">
              <span></span>
              <span></span>
              <span class="total-etiquette">Total</span>
              <span class="total-jour" data-jour="0" title="Total dimanche">-</span>
              <span class="total-jour" data-jour="1" title="Total lundi">-</span>
              <span class="total-jour" data-jour="2" title="Total mardi">-</span>
              <span class="total-jour" data-jour="3" title="Total mercredi">-</span>
              <span class="total-jour" data-jour="4" title="Total jeudi">-</span>
              <span class="total-jour" data-jour="5" title="Total vendredi">-</span>
              <span class="total-jour" data-jour="6" title="Total samedi">-</span>
            </div>

            <!-- Les lignes sont créées par script.js -->
            <div id="feuille-corps"></div>
          </div>
        </div>
      </div>

    <!-- Bouton plein écran (caché si le navigateur ne le permet pas, ex. iPhone) -->
      <button type="button" class="btn-plein-ecran" id="btn-plein-ecran" title="Passer en plein écran" aria-label="Passer en plein écran" hidden>
        <svg class="icone-agrandir" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="icone-reduire" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

    </section>
        <!-- ========== 6. TO-DO LISTE ========== -->
    <section class="view view--app" id="todo">
      <header class="app-entete todo-entete">
        <button type="button" class="btn btn--contour-clair" data-goto="app">← Retour au suivi</button>
        <h1 class="todo-titre">To-do liste</h1>
        <span class="statut" id="statut-todo" aria-live="polite"></span>
      </header>

      <div class="todo-corps">
        <form class="todo-ajout" id="form-todo">
          <label for="todo-texte" class="sr-only">Nouvelle tâche</label>
          <input type="text" id="todo-texte" maxlength="200" autocomplete="off" placeholder="Nouvelle tâche…">
          <button type="submit" class="btn btn--bordure">Ajouter</button>
        </form>

        <p class="message" id="message-todo" role="status" aria-live="polite"></p>

        <ul class="todo-liste" id="todo-liste"></ul>

        <div class="todo-pied">
          <span id="todo-compteur"></span>
          <button type="button" class="btn btn--bordure" id="btn-todo-nettoyer" hidden>Retirer les tâches terminées</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Menu du clic droit sur une case -->
  <div class="menu-contextuel" id="menu-contextuel" role="menu" hidden></div>

  <!-- Panneau des couleurs du thème (bouton de réglage en haut à gauche) -->
  <div class="panneau-reglages" id="panneau-reglages" role="dialog" aria-labelledby="titre-reglages" hidden>
    <h2 id="titre-reglages">Couleurs</h2>
    <label class="ligne-couleur" for="couleur-fonce">
      <span>Couleur foncée</span>
      <input type="color" id="couleur-fonce" value="#666441">
    </label>
    <label class="ligne-couleur" for="couleur-pale">
      <span>Couleur pâle</span>
      <input type="color" id="couleur-pale" value="#e4dcc0">
    </label>
    <button type="button" class="btn btn--contour" id="btn-couleurs-defaut">Couleurs par défaut</button>
  </div>

  <!-- Infobulle qui affiche le commentaire d'une case -->
  <div class="infobulle" id="infobulle" role="tooltip" hidden></div>

  <!-- Fenêtre pour écrire un commentaire -->
  <dialog id="dialogue-commentaire" aria-labelledby="titre-commentaire">
    <form method="dialog" id="form-commentaire">
      <h2 id="titre-commentaire">Commentaire</h2>
      <label for="texte-commentaire" class="sr-only">Commentaire</label>
      <textarea id="texte-commentaire" rows="4" maxlength="500"></textarea>
      <div class="dialogue-actions">
        <button type="button" class="btn btn--contour" id="btn-annuler-commentaire">Annuler</button>
        <button type="submit" class="btn btn--olive">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <!-- Fenêtre pour ajouter du temps à la main (s'additionne au temps de la case) -->
  <dialog id="dialogue-ajout" aria-labelledby="titre-ajout">
    <form id="form-ajout">
      <h2 id="titre-ajout">Ajouter du temps</h2>
      <p class="dialogue-aide" id="aide-ajout"></p>
      <label for="valeur-ajout" class="sr-only">Temps à ajouter, en heures</label>
      <input type="text" id="valeur-ajout" inputmode="decimal" autocomplete="off" placeholder="En heures : 0,5 = 30 min">
      <p class="message" id="message-ajout" role="alert"></p>
      <div class="dialogue-actions">
        <button type="button" class="btn btn--contour" id="btn-annuler-ajout">Annuler</button>
        <button type="submit" class="btn btn--olive">Ajouter</button>
      </div>
    </form>
  </dialog>
  <!-- Menu du bouton « Outils » -->
  <div class="menu-contextuel menu-outils" id="menu-outils" role="menu" hidden>
    <button type="button" role="menuitem" data-goto="todo">To-do liste</button>
    <button type="button" role="menuitem" id="btn-ouvrir-convertisseur">Minutes en heures</button>
  </div>

  <!-- Convertisseur : heures et minutes -> heures décimales -->
  <dialog id="dialogue-convertisseur" aria-labelledby="titre-convertisseur">
    <form id="form-convertisseur">
      <h2 id="titre-convertisseur">Minutes en heures</h2>
      <label for="valeur-convertisseur" class="sr-only">Temps à convertir</label>
      <input type="text" id="valeur-convertisseur" inputmode="decimal" autocomplete="off" placeholder="Ex. : 1,45">
      <div class="convertisseur-resultat" aria-live="polite">
        <strong id="resultat-convertisseur">-</strong>
        <span class="convertisseur-detail" id="detail-convertisseur"></span>
      </div>
      <p class="message" id="message-convertisseur" role="status"></p>
      <div class="dialogue-actions">
        <button type="button" class="btn btn--contour" id="btn-fermer-convertisseur">Fermer</button>
        <button type="button" class="btn btn--olive" id="btn-copier-resultat" disabled>Copier</button>
      </div>
    </form>
  </dialog>
  <!-- type="module" : nécessaire pour importer Firebase -->
  <script type="module" src="script.js"></script>
  <script type="module" src="outils.js"></script>
</body>
</html>
